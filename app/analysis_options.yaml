include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/bridge/generated/**
    - lib/l10n/app_localizations*.dart
    - build/**
    - ios/**
    # Vendored flutter_rust_bridge build tooling (its own package, resolved
    # only during native builds).
    - rust_builder/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - require_trailing_commas
