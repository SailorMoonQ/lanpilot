[package]
name = "lpctl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
lanpilot-core = { path = "../../core" }
lanpilot-input = { path = "../../input" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
dirs = "6"
prost = "0.13"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
lanpilot-agent = { path = "../../agent" }
tempfile = "3"
